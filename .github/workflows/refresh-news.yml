name: Refresh Arsenal headlines
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: arsenal-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect headlines
        run: python scripts/update_news.py
      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- news.json && [ -f news.json ]; then
            echo "No changes to news.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Arsenal headlines"
          git push
